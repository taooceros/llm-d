[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "admission-control-vllm"
version = "0.2.0"
description = "Admission Control, Preemption Gating, and Clairvoyant Oracle Scheduling for vLLM on Cloud TPU"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ray>=2.10.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
]

[project.scripts]
admission-control = "admission_control.cli:main"
omp-rcm = "omp_rcm.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["admission_control*", "omp_rcm*", "pkg_util*"]
