apiVersion: v1
kind: Service
metadata:
  name: omp-gateway
  namespace: llm-d-optimized-baseline
  labels:
    app.kubernetes.io/part-of: omp-hetero
spec:
  type: ClusterIP
  selector:
    ray.io/cluster: tpu-ray-cluster-vllm-tpu
    ray.io/node-type: head
  ports:
    - name: http
      port: 80
      targetPort: 8200
    # Standard envoy.service.ext_proc.v3 RPC, not the HTTP serving port.
    - name: grpc-ext-proc
      appProtocol: kubernetes.io/h2c
      port: 9002
      targetPort: 8201
---
apiVersion: inference.networking.k8s.io/v1
kind: InferencePool
metadata:
  name: omp-hetero
  namespace: llm-d-optimized-baseline
  labels:
    app.kubernetes.io/part-of: omp-hetero
spec:
  appProtocol: http
  selector:
    matchLabels:
      omp.llm-d.ai/instance: "true"
  targetPorts:
    - number: 8000
  endpointPickerRef:
    failureMode: FailClose
    group: ""
    kind: Service
    name: omp-gateway
    port:
      number: 9002
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: omp-gateway
  namespace: llm-d-optimized-baseline
  labels:
    app.kubernetes.io/part-of: omp-hetero
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["inference.networking.k8s.io"]
    resources: ["inferencepools"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: omp-gateway
  namespace: llm-d-optimized-baseline
  labels:
    app.kubernetes.io/part-of: omp-hetero
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: omp-gateway
subjects:
  - kind: ServiceAccount
    name: default
    namespace: llm-d-optimized-baseline
